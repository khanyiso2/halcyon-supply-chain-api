name: CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: supply_chain_db
          POSTGRES_USER: supply_chain_user
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supply_chain_user -d supply_chain_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-test-only-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: supply_chain_db
      DB_USER: supply_chain_user
      DB_PASSWORD: test-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint Python code
        run: flake8 config supply_chain --exclude=supply_chain/migrations --max-line-length=120 --extend-ignore=E203,W503

      - name: Run tests with coverage
        run: python -m pytest --cov=supply_chain --cov-report=term-missing --cov-fail-under=80

      - name: Build Docker image
        run: docker build -t halcyon-supply-chain-api:ci .
